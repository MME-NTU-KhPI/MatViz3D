# Trial at the production grid: 40 cells, all six groups, three laws.
output_dir: ../../data/trial64
matviz: ../../build/MatViz3D.app/Contents/MacOS/MatViz3D
size: 64
fft_tol: 1e-4
fft_max_iter: 3000
timeout_s: 1800
oversample: 1.0
seed0: 7000

common:
  lattice_cell_mm: [6.0, 15.0]
  relative_density: [0.20, 0.50]

laws:
  - {id: petg_ref,  E_GPa: 2.0, nu: 0.38, aniso: 1.0}
  - {id: petg_soft, E_GPa: 1.6, nu: 0.40, aniso: 0.8}
  - {id: petg_stiff,E_GPa: 2.4, nu: 0.36, aniso: 0.9}

families:
  fourier_sheet:    {quota: 8, params: {fourier_terms: [8, 40], fourier_kmin: 1.0, fourier_kmax: [2.0, 5.0], fourier_decay: [0.5, 2.0], cells_per_edge: 1}, flags: [lattice_uniform_wall]}
  fourier_skeletal: {quota: 8, params: {fourier_terms: [8, 40], fourier_kmin: 1.0, fourier_kmax: [2.0, 5.0], fourier_decay: [0.5, 2.0], cells_per_edge: 1}}
  spinodoid:        {quota: 8, params: {spinodoid_theta_x: {choices: [0, 15, 30, 60, 90]}, spinodoid_theta_y: {choices: [0, 15, 30, 60, 90]}, spinodoid_theta_z: {choices: [0, 15, 30, 60, 90]}, cells_per_edge: [2, 6]}}
  noise_skeletal:   {quota: 4, params: {noise_smooth: [0.04, 0.12], cells_per_edge: 1}}
  noise_sheet:      {quota: 4, params: {noise_smooth: [0.04, 0.12], cells_per_edge: 1}}
  anchors:          {quota: 8, params: {lattice_family: {choices: [gyroid_sheet, gyroid_skeletal, schwarz_p_sheet, schwarz_d_sheet, iwp_sheet, bcc, fcc, octet, honeycomb, reentrant]}, cells_per_edge: [1, 3], lattice_grading: [0.0, 0.3], lattice_jitter: [0.0, 0.1]}, flags: [lattice_uniform_wall]}
