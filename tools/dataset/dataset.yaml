# Dataset v1: geometry + material law -> linear properties. Paths are relative
# to this file. Quotas are before printability rejection; `oversample` adds
# the margin for it.
output_dir: ../../data/v1
matviz: ../../build/MatViz3D.app/Contents/MacOS/MatViz3D
size: 64
fft_tol: 1e-4
fft_max_iter: 3000
timeout_s: 1800
oversample: 1.5
seed0: 100000

common:
  lattice_cell_mm: [6.0, 15.0]
  relative_density: [0.20, 0.50]

laws:                                   # assigned round-robin to the rows
  - {id: petg_ref,  E_GPa: 2.0, nu: 0.38, aniso: 1.0}
  - {id: petg_soft, E_GPa: 1.6, nu: 0.40, aniso: 0.8}
  - {id: petg_stiff,E_GPa: 2.4, nu: 0.36, aniso: 0.9}

families:
  # Ranges follow a printability scan at 64^3 (0.8 mm wall): random sheets need
  # cells >= 10 mm, density >= 0.30, kmax <= 4, decay >= 1; smoothed noise needs
  # smoothing >= 0.10 (sheet) / 0.08 (skeletal). Quotas count ACCEPTED cells,
  # oversample is the draw margin for printability rejection (rejects cost ~0.3 s).
  fourier_sheet:
    quota: 1500
    oversample: 2.5
    params: {lattice_cell_mm: [10.0, 15.0], relative_density: [0.30, 0.50],
             fourier_terms: [8, 40], fourier_kmin: 1.0, fourier_kmax: [2.0, 4.0], fourier_decay: [1.0, 2.0], cells_per_edge: 1}
    flags: [lattice_uniform_wall]
  fourier_skeletal:
    quota: 1500
    oversample: 2.0
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             fourier_terms: [8, 40], fourier_kmin: 1.0, fourier_kmax: [2.0, 4.0], fourier_decay: [0.75, 2.0], cells_per_edge: 1}
  spinodoid:
    quota: 2000
    oversample: 1.6
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             spinodoid_theta_x: {choices: [0, 15, 30, 60, 90]}, spinodoid_theta_y: {choices: [0, 15, 30, 60, 90]},
             spinodoid_theta_z: {choices: [0, 15, 30, 60, 90]}, cells_per_edge: [2, 6]}
  noise_skeletal:
    quota: 1000
    oversample: 2.5
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50], noise_smooth: [0.08, 0.20], cells_per_edge: 1}
  noise_sheet:
    quota: 1000
    oversample: 2.5
    params: {lattice_cell_mm: [10.0, 15.0], relative_density: [0.30, 0.50], noise_smooth: [0.10, 0.25], cells_per_edge: 1}
  fourier_cubic:
    quota: 800
    oversample: 2.5
    params: {lattice_cell_mm: [10.0, 15.0], relative_density: [0.30, 0.50], fourier_symmetry: cubic,
             fourier_terms: [2, 8], fourier_kmin: 1.0, fourier_kmax: [2.0, 4.0], fourier_decay: [1.0, 2.0], cells_per_edge: 1}
    flags: [lattice_uniform_wall]
  plates:
    quota: 700
    oversample: 1.6
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             lattice_family: {choices: [plate_sc, plate_bcc, plate_fcc, plate_sc_bcc, plate_sc_fcc, plate_bcc_fcc]},
             plate_hole: [0.0, 0.5], cells_per_edge: [1, 2]}
  hybrids:
    quota: 500
    oversample: 1.6
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             lattice_family: {choices: [plate_sc, plate_sc_fcc, plate_bcc]},
             lattice_union: {choices: [octet, bcc, fcc, simple_cubic]},
             plate_hole: [0.2, 0.5], lattice_smooth: [0.0, 0.04], cells_per_edge: [1, 2]}
  carved:
    quota: 500
    oversample: 1.8
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             lattice_family: {choices: [plate_sc, plate_sc_fcc, plate_sc_bcc, plate_bcc, octet, bcc]},
             lattice_subtract: {choices: [spheres_sc, spheres_bcc, spheres_fcc, cylinders_axes]},
             lattice_subtract_size: [0.15, 0.4], lattice_smooth: [0.0, 0.05], cells_per_edge: [1, 2]}
  anchors:
    quota: 1500
    oversample: 1.6
    params: {lattice_cell_mm: [8.0, 15.0], relative_density: [0.25, 0.50],
             lattice_family: {choices: [gyroid_sheet, gyroid_skeletal, schwarz_p_sheet, schwarz_d_sheet, iwp_sheet, bcc, fcc, octet, honeycomb, reentrant]},
             cells_per_edge: [1, 3], lattice_grading: [0.0, 0.3], lattice_jitter: [0.0, 0.1]}
    flags: [lattice_uniform_wall]
