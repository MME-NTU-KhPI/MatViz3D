      fourier_decay:
      - 0.5
      - 2.5
      cells_per_edge: 1
      lattice_smooth:
      - 0.0
      - 0.04
      lattice_family: fourier_sheet
    flags:
    - lattice_uniform_wall
  fourier_cubic_skeletal:
