# Adaptive grid: each row is probed on 64^3 (geometry + printability, seconds); the
# stiffness solve then runs on the smallest grid where the thinnest wall spans
# >= 8 voxels (64^3 vs 128^3 check: error ~ 350/v^2 %, v = voxels per wall).
# Noise families are pinned to 64^3 (their random field is drawn on the grid).
# Periodic families without grading/jitter are solved as one unit cell.
output_dir: ../../data/v1
matviz: ../../build/MatViz3D.app/Contents/MacOS/MatViz3D
size: 64
fft_tol: 1e-5
fft_discretization: rotated
# Willot rotated scheme (converges for true pores). Void stiffness is adaptive: solve with
# 1e-4 of C11 (fast, ~1 % off for sheets), and when the solid carries less than 98.5 % of the
# strain energy in some load (soft cells: the void props them up) solve again with 1e-6,
# the smallest void stiffness used. Grids are powers of two only:
# 96^3 goes through Bluestein's FFT and costs twice as much as 128^3.
fft_void_eta: 1e-4
fft_void_eta_fallback: 1e-6
void_extrapolate: false
min_solid_energy_share: 0.985
# on 128^3 the 1e-6 re-solve takes 1-2 h; keep the 1e-4 answer when the share is at least 0.97
min_solid_energy_share_by_grid:
  128: 0.97
fft_max_iter: 10000
timeout_s: 3600
oversample: 1.6
grid:
  sizes:
  - 64
  - 128
  min_wall_vox: 6
  probe: 64
  pinned:
    noise_sheet: 64
    noise_skeletal: 64
  single_cell_families:
  - gyroid_sheet
  - gyroid_skeletal
  - schwarz_p_sheet
  - schwarz_p_skeletal
  - schwarz_d_sheet
  - schwarz_d_skeletal
  - iwp_sheet
  - iwp_skeletal
  - simple_cubic
  - bcc
  - fcc
  - octet
  - honeycomb
  - reentrant
  - plate_sc
  - plate_bcc
  - plate_fcc
  - plate_sc_bcc
  - plate_sc_fcc
  - plate_bcc_fcc
  - plate_sc_bcc_fcc
seed0: 100000
common:
  lattice_cell_mm:
  - 6.0
  - 18.0
  relative_density:
  - 0.15
  - 0.55
laws:
  E_GPa:
  - 1.2
  - 3.6
  nu:
  - 0.3
  - 0.45
  aniso:
  - 0.5
  - 1.0
families:
  fourier_sheet:
    quota: 6000
    oversample: 2.5
    params:
      lattice_cell_mm:
      - 9.0
      - 18.0
      relative_density:
      - 0.25
      - 0.55
      fourier_terms:
      - 4
      - 60
      fourier_kmin:
      - 1.0
      - 2.0
      fourier_kmax:
      - 2.0
      - 5.0
      fourier_decay:
      - 0.5
      - 2.5
      cells_per_edge: 1
      lattice_grading:
      - 0.0
      - 0.2
      lattice_jitter:
      - 0.0
      - 0.1
    flags:
    - lattice_uniform_wall
  fourier_skeletal:
    quota: 6000
    oversample: 2.0
    params:
      lattice_cell_mm:
      - 7.0
      - 18.0
      relative_density:
      - 0.2
      - 0.55
      fourier_terms:
      - 4
      - 60
      fourier_kmin:
      - 1.0
      - 2.0
      fourier_kmax:
      - 2.0
      - 5.0
      fourier_decay:
      - 0.5
      - 2.5
      cells_per_edge: 1
      lattice_grading:
      - 0.0
      - 0.2
      lattice_jitter:
      - 0.0
      - 0.1
  fourier_cubic:
