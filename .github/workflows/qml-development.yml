name: Build MatViz3D

on:
  push:
    branches:
      - qml-development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Qt Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'desktop'
          modules: 'qt5compat qtcharts'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            libxkbcommon-x11-0 \
            libfontconfig1-dev \
            libx11-dev \
            libhdf5-dev \
            libomp-dev

      - name: Configure
        run: |
          qmake MatViz3D.pro CONFIG+=debug

      - name: Build
        run: |
          make -j$(nproc)

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatViz3D-linux
          path: |
            MatViz3D
            *.so

  build-windows:
    name: Windows Qt Build
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qt5compat qtcharts'
          tools: 'tools_mingw1310'

      - name: Add Qt MinGW to PATH
        shell: pwsh
        run: |
          $mingwDir = Get-ChildItem "$env:RUNNER_WORKSPACE\Qt\Tools" -Filter "mingw*" |
                      Sort-Object Name -Descending | Select-Object -First 1
          echo "$($mingwDir.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install HDF5 via MSYS2
        shell: pwsh
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-hdf5"
          echo "HDF5_DIR=C:/msys64/mingw64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: cmd
        run: |
          qmake MatViz3D.pro CONFIG+=debug

      - name: Build
        shell: cmd
        run: |
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatViz3D-windows
          path: |
            debug\MatViz3D.exe
            release\MatViz3D.exe

        uses: actions/upload-artifact@v4
        with:
          name: MatViz3D-macos
          path: MatViz3D.app
